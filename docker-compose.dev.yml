# Local development: only Postgres, its port bound to 127.0.0.1. The app runs with `pnpm run dev`.
name: promo-match-dev

services:
  db:
    # Postgres 18 with the pgvector extension (docs/decisions.md); keep the same tag as docker-compose.yml
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      # Over TCP: the first-start init server listens only on the socket, so a socket check would pass too early
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
