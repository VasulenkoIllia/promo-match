name: CI

# Pushes to main only: the owner commits to main, and a public repository should not run anything for strangers' pull
# requests. Every green push publishes an image; the deploy follows when DEPLOY_ENABLED is true (docs/deployment.md).
on:
  push:
    branches: [main]

permissions: {}

# A run in progress on main finishes, so a deploy is never cut off; a newer push waits for it
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Node 25 and later ship no corepack: pnpm of packageManager in package.json, the same way as in the Dockerfile
      - run: npm install --global --allow-scripts=pnpm pnpm@12.14.0
      - run: pnpm install --frozen-lockfile
      # Typecheck, lint, tests and build; the tests need no database
      - run: pnpm run check

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secrets in the git history
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --no-banner --redact --exit-code 1 /repo
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global --allow-scripts=pnpm pnpm@12.14.0
      # Reads pnpm-lock.yaml only, nothing is installed
      - name: Known vulnerabilities in production packages
        run: pnpm audit --prod --audit-level high
      - name: Commit authors
        env:
          COMMIT_AUTHOR_EMAIL: ${{ vars.COMMIT_AUTHOR_EMAIL }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash deploy/check-commits.sh "$COMMIT_AUTHOR_EMAIL" "$BASE_SHA" "$HEAD_SHA"
      - name: Shell scripts of the deploy
        run: shellcheck deploy/*.sh
      # -q prints nothing, so no value reaches the log
      - name: Compose files
        env:
          IMAGE_TAG: sha-0000000000000000000000000000000000000000
          APP_NAME: promo-match
          APP_DOMAIN: check.example.com
          TRAEFIK_NETWORK: proxy
          TRAEFIK_ENTRYPOINT: websecure
          TRAEFIK_CERTRESOLVER: check
          POSTGRES_DB: check
          POSTGRES_USER: check
          POSTGRES_PASSWORD: check
        # The production file reads ../.env (it runs from <env dir>/release/ on the server), the dev file ./.env
        run: |
          touch ../.env .env
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.dev.yml config -q

  image:
    needs: [verify, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image reference
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Loaded locally first: an image with a critical finding never reaches the registry
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          provenance: false
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          severity: CRITICAL
          exit-code: "1"
      - name: Image starts
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: bash deploy/smoke-image.sh "$IMAGE_REF"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: docker push "$IMAGE_REF"

  # Separate from `image`: a failed cleanup must not stop a deploy of an image that is already published
  clean-images:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Keep the last 30 versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: bash deploy/clean-images.sh promo-match 30 "$IMAGE_TAG"

  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    needs: image
    runs-on: ubuntu-24.04
    # Above the usual worst case on the server: a 15 minute wait for the lock of a cancelled run, three stalled pulls of
    # 6 minutes, the dump, then the migrations and the rollout. A nightly import holds the lock longer: such a deploy
    # fails after the wait and is run again later.
    timeout-minutes: 50
    permissions:
      contents: read
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash deploy/remote-deploy.sh "sha-${GITHUB_SHA}"
